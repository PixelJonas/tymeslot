name: Build fix image for local testing

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: arc-runner-set-tymeslot

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "ref_tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Configure podman unqualified-search registry
        run: |
          mkdir -p /etc/containers
          printf 'unqualified-search-registries = ["docker.io"]\n' > /etc/containers/registries.conf

      - name: Build and push
        run: |
          # --network=host: this runner's podman uses rootful netavark bridge
          # networking for build containers by default, which is confirmed
          # unreliable here (reproduced directly: `podman run` with default
          # bridge networking times out reaching repo.hex.pm/deb.debian.org,
          # consistently, while `podman run --network=host` - sharing the
          # runner pod's own already-working network namespace - succeeds
          # every time). Building with host networking sidesteps the broken
          # bridge/NAT path entirely instead of chasing per-destination
          # workarounds.
          docker build --network=host -f Dockerfile.docker \
            -t ghcr.io/pixeljonas/tymeslot:${{ steps.meta.outputs.ref_tag }} \
            -t ghcr.io/pixeljonas/tymeslot:sha-${{ steps.meta.outputs.sha_short }} \
            .
          docker push --all-tags ghcr.io/pixeljonas/tymeslot

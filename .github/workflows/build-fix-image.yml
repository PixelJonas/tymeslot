name: Build fix image for local testing

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: arc-runner-set-tymeslot

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Podman (this runner's docker-cli emulation layer) refuses short image
      # names by default — "hexpm/elixir:..." in the Dockerfile's FROM line
      # needs docker.io as an unqualified-search registry, or the build fails
      # with "did not resolve to an alias and no unqualified-search
      # registries are defined".
      - name: Allow unqualified docker.io image names for podman
        run: echo 'unqualified-search-registries = ["docker.io"]' >> /etc/containers/registries.conf

      # This cluster's pod network MTU is 1400 (OVN-Kubernetes default) vs
      # the host's 1500, which black-holes larger packets on plain-HTTP apt
      # transfers (deb.debian.org connects, then stalls indefinitely — HTTPS
      # registry pulls are unaffected, likely luck of packet sizing). Clamp
      # outbound TCP MSS to the path MTU so the build container's own
      # connections negotiate a size that survives the encapsulation, rather
      # than trying to fix the cluster-wide MTU for one test build.
      - name: Clamp TCP MSS for the pod-network MTU mismatch
        run: iptables -t mangle -A POSTROUTING -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "ref_tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        run: |
          docker build -f Dockerfile.docker \
            -t ghcr.io/pixeljonas/tymeslot:${{ steps.meta.outputs.ref_tag }} \
            -t ghcr.io/pixeljonas/tymeslot:sha-${{ steps.meta.outputs.sha_short }} \
            .
          docker push ghcr.io/pixeljonas/tymeslot:${{ steps.meta.outputs.ref_tag }}
          docker push ghcr.io/pixeljonas/tymeslot:sha-${{ steps.meta.outputs.sha_short }}

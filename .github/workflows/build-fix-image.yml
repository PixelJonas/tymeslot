name: Build fix image for local testing

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: arc-runner-set-tymeslot

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Podman (this runner's docker-cli emulation layer) refuses short image
      # names by default — "hexpm/elixir:..." in the Dockerfile's FROM line
      # needs docker.io as an unqualified-search registry, or the build fails
      # with "did not resolve to an alias and no unqualified-search
      # registries are defined".
      - name: Allow unqualified docker.io image names for podman
        run: echo 'unqualified-search-registries = ["docker.io"]' >> /etc/containers/registries.conf

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "ref_tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        run: |
          docker build -f Dockerfile.docker \
            -t ghcr.io/pixeljonas/tymeslot:${{ steps.meta.outputs.ref_tag }} \
            -t ghcr.io/pixeljonas/tymeslot:sha-${{ steps.meta.outputs.sha_short }} \
            .
          docker push --all-tags ghcr.io/pixeljonas/tymeslot
